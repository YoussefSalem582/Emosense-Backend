[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]
extend-exclude = "alembic/versions"

[tool.isort]
profile = "black"
line_length = 100
skip = ["alembic/versions"]

[tool.mypy]
python_version = "3.9"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
# Pragmatic starting point: not strict yet. Tighten in later phases.
check_untyped_defs = true
exclude = "(alembic/|tests/)"

[tool.pytest.ini_options]
minversion = "7.0"
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/__init__.py", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
