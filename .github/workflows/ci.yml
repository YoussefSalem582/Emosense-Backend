name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: flake8 (hard errors)
        run: flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: flake8 (full, non-blocking)
        run: flake8 app --count --exit-zero --statistics
      - name: black --check (non-blocking)
        run: black --check app || true
      - name: mypy (non-blocking)
        run: mypy app || true

  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: test-secret-key
      DATABASE_URL: sqlite+aiosqlite:///./test.db
      ENVIRONMENT: testing
      DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing

  migrations:
    name: Migrations (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: emosense
          POSTGRES_PASSWORD: emosense
          POSTGRES_DB: emosense
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emosense"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: test-secret-key
      DATABASE_URL: postgresql+asyncpg://emosense:emosense@localhost:5432/emosense
      ENVIRONMENT: testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Apply and revert migrations on PostgreSQL
        run: |
          alembic upgrade head
          alembic downgrade base
